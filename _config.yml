title: Mykhailo Markhain
description: Notes, ideas, and things I'm learning.
url: https://zomer701.github.io
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default
locale: en-US
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: /page:num/

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-paginate

author:
  name: Mykhailo Markhain
  links:
    - label: LinkedIn
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/mykhailo-markhain-06635093/
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/zomer701

footer:
  links:
    - label: CV
      icon: fas fa-fw fa-file-alt
      url: https://mykhailo-markhain-cv.zambezi701.chatgpt.site/
    - label: LinkedIn
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/mykhailo-markhain-06635093/
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/zomer701

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
